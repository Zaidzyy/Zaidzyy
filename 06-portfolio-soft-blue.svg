<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<style>
.title{font-family:Inter,Arial,sans-serif;font-size:27px;font-weight:800;letter-spacing:-.8px}
.sub{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:500;letter-spacing:2.5px}
.body{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:600}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(8px)}100%{transform:translateX(0)}}
.float{animation:float 4s ease-in-out infinite}
.pulse{animation:pulse 2.5s ease-in-out infinite}
.drift{animation:drift 5s ease-in-out infinite}
</style>
<defs><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#087ea4"/><stop offset="1" stop-color="#04c6e9"/></linearGradient></defs>
<rect width="1200" height="300" fill="#050505"/>
<circle cx="1020" cy="150" r="145" fill="#08bfe9" opacity=".045"/>
<g transform="translate(90 150)">
<g class="float">
 <circle cx="0" cy="0" r="57" fill="#111214" stroke="#25272b" stroke-width="2"/>
 <circle cx="0" cy="-5" r="28" fill="#f0c5a7"/>
 <path d="M-28-10Q-20-42 3-38Q28-38 31-10Q20-25 5-22Q-12-20-28-10Z" fill="#17181b"/>
 <circle cx="-10" cy="-4" r="3.2" fill="#111"/><circle cx="11" cy="-4" r="3.2" fill="#111"/>
 <path d="M-8 10Q0 17 8 10" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
 <path d="M-28 28Q0 12 28 28L34 55H-34Z" fill="#22252a"/>
</g></g>
<g transform="translate(205 82)">
 <rect width="600" height="140" rx="28" fill="#101113"/>
 <text x="34" y="45" class="sub" fill="#778087">CYBERSECURITY × AI</text>
 <text x="34" y="82" class="title" fill="#fff">AI SECURITY ENGINEER</text>
 <text x="34" y="112" class="body" fill="#898d92">Secure. Automate. Innovate.</text>
 <rect x="34" y="125" width="170" height="2" fill="url(#blue)"/>
</g>
<g transform="translate(930 150)" class="float">
 <circle r="60" fill="#0f1113"/><circle r="48" fill="url(#blue)" opacity=".15"/>
 <path d="M-25 8L0-25L25 8L0 29Z" fill="none" stroke="#08bfe9" stroke-width="3"/>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<style>
.title{font-family:Inter,Arial,sans-serif;font-size:27px;font-weight:800;letter-spacing:-.8px}
.sub{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:500;letter-spacing:2.5px}
.body{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:600}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(8px)}100%{transform:translateX(0)}}
.float{animation:float 4s ease-in-out infinite}
.pulse{animation:pulse 2.5s ease-in-out infinite}
.drift{animation:drift 5s ease-in-out infinite}
</style>
<rect width="1200" height="300" fill="#050505"/>
<text x="600" y="50" text-anchor="middle" class="sub" fill="#707278">WHAT I BUILD</text>
<text x="600" y="83" text-anchor="middle" class="title" fill="#fff">AI × SECURITY × AUTOMATION</text>
<g transform="translate(70 115)">
 <rect width="315" height="125" rx="24" fill="#151618"/>
 <text x="24" y="35" class="title" font-size="18" fill="#fff">AI Security</text>
 <text x="24" y="58" class="body" fill="#85878c">SOC automation &amp; threat</text><text x="24" y="75" class="body" fill="#85878c">investigation workflows</text>
 <circle cx="270" cy="77" r="27" fill="#08bfe9" opacity=".13"/><path d="M258 77L270 64L282 77L270 90Z" fill="#08bfe9"/>
</g>
<g transform="translate(442 115)">
 <rect width="315" height="125" rx="24" fill="#151618"/>
 <text x="24" y="35" class="title" font-size="18" fill="#fff">Agentic AI</text>
 <text x="24" y="58" class="body" fill="#85878c">LLMs, tools, MCPs &amp;</text><text x="24" y="75" class="body" fill="#85878c">autonomous workflows</text>
 <circle cx="270" cy="77" r="27" fill="#08bfe9" opacity=".13"/><circle cx="270" cy="77" r="10" fill="none" stroke="#08bfe9" stroke-width="2"/>
</g>
<g transform="translate(814 115)">
 <rect width="315" height="125" rx="24" fill="#151618"/>
 <text x="24" y="35" class="title" font-size="18" fill="#fff">Offensive Security</text>
 <text x="24" y="58" class="body" fill="#85878c">Pentesting, research &amp;</text><text x="24" y="75" class="body" fill="#85878c">adversarial testing</text>
 <circle cx="270" cy="77" r="27" fill="#08bfe9" opacity=".13"/><path d="M258 88L270 63L282 88L270 82Z" fill="none" stroke="#08bfe9" stroke-width="2"/>
</g>
<rect x="70" y="266" width="1060" height="1" fill="#1d1e20"/>
</svg>